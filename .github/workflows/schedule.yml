name: Melon Chart Crawler

on:
  schedule:
    # 깃허브 액션은 UTC 기준입니다. 
    # 한국 시간(KST) 오후 3시 = UTC 오전 6시
    - cron: '0 6 * * *'
  workflow_dispatch: # 수동으로 실행해볼 수 있는 버튼 생성

jobs:
  build:
    runs-on: ubuntu-24.04 # 2026년 10월 19일 마이그레이션 안내에 따라 안정적인 환경(Ubuntu 24.04)으로 명시

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # Node.js 20 버전 경고 해결을 위해 v4로 업데이트

    - name: Set up Python
      uses: actions/setup-python@v5 # Node.js 20 버전 경고 해결을 위해 v5로 업데이트
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run crawler script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python melon_crawler.py
